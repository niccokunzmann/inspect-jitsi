name: tests

on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    strategy:
      matrix:
        python-version:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
      fail-fast: false

    runs-on: ubuntu-latest
    name: py${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Pip cache
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"
    - name: Test
      run: pytest

  deploy-tag-to-pypi:
    # only deploy on tags, see https://stackoverflow.com/a/58478262/1320237
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - run-tests
    runs-on: ubuntu-latest
    # Configure this project as a "trusted publisher" for the PyPI environment
    # at https://pypi.org/manage/project/inspect-jitsi/settings/publishing/
    # (repo: niccokunzmann/inspect-jitsi, workflow: tests.yml, environment: PyPI)
    # - no PyPI token/secret needed, GitHub's OIDC token is exchanged for one.
    # see https://docs.pypi.org/trusted-publishers/
    environment:
      name: PyPI
      url: https://pypi.org/project/inspect-jitsi/
    permissions:
      id-token: write  # required to mint the OIDC token for trusted publishing
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade build
    - name: remove old files
      run: rm -rf dist/*
    - name: build distribution files
      run: python -m build
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  deploy-github-release:
    # only deploy on tags, see https://stackoverflow.com/a/58478262/1320237
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - run-tests
    - deploy-tag-to-pypi
    runs-on: ubuntu-latest
    environment:
      name: github-release
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub release from tag
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          body: "This release can be installed from [PyPI](https://pypi.org/project/inspect-jitsi/#history)."
          generateReleaseNotes: true
